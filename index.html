<!DOCTYPE html>
<!-- @@COPYRIGHT -->
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- for leaflet/openstreet to get rid of referer error -->
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <!-- you can also inject a whole other script (everything is global)
    <script>
       function otherLocationService(updater)
       {
         var data = {timestamp: 1, coords: {latitude: 2, longitude: 3, heading: 4, speed: 5}};
         updater(data);
       }
    </script>
    -->

    <script>

       // wait for everything to load
       window.addEventListener('load', startup, true);

       var posCount = 0;
       var running = false;
       var watchId;
       var map;
       var curLocMarker;
       var os;

       async function startup()
       {
         document.getElementById('startTrack').addEventListener('click', toggleGps);

         document.getElementById('showOnMap').addEventListener('click', showOnMap);

         // TODO: only available in https
         // otherwise navigator.share is not a function
         if ( 'share' in navigator )
           document.getElementById('share').addEventListener('click', share);
         else
           document.getElementById('share').style.visibility = 'hidden';

         document.getElementById('loadFile').addEventListener('click', function()
         {
           loadJsonFile(function(data, fileName)
           {
             document.getElementById('loadFileRes').textContent = fileName;
           });
         });
  
         os = await getMobileOS();

         getSerialPorts();

         initMap();
       }

       async function getMobileOS()
       {
         // 1. Try the Modern API (Chrome/Android/Edge)
         if ( navigator.userAgentData )
         {
           try
           {
             const hints = await navigator.userAgentData.getHighEntropyValues(['platform']);

             if (hints.platform === 'Android')
               return 'android';
             //if (hints.platform === "iOS")
             //  return "iOS"; // Rare, but possible in future
           }
           catch (e)
           {
             // Fall through to legacy if API fails
           }
         }

         // 2. Fallback to Legacy String (Safari/iOS/Firefox)
         //const ua = navigator.userAgent;
         const ua = navigator.userAgent || navigator.vendor || window.opera

         // Windows Phone must come first because its UA also contains "Android"
         if (/windows phone/i.test(ua))
           return 'winphone';

         if (/android/i.test(ua))
           return 'android';

         // Detailed iOS check (Includes iPadOS "Macintosh" fix)
         if ( (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) || 
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1))
           return 'ios';

         return 'other';
       }

       function initMap()
       {
         // Initialize the map centered on a default location
         map = L.map('map').setView([0, 0], 2); 

         // Add OpenStreetMap tiles
         //L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
         L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
         {
           maxZoom: 19,
           attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
         }).addTo(map);

         // Create a special marker for the user (The "Blue Dot")
         curLocMarker = L.circleMarker([0, 0], {
           radius: 8,
           fillColor: "#3388ff",
           color: "#fff",
           weight: 2,
           opacity: 1,
           fillOpacity: 0.8
         }).addTo(map);
       }

       function updateMapPos(pos)
       {
         const { latitude, longitude, accuracy } = pos.coords;

         const newPos = [latitude, longitude];

         // 1. Move the marker to the new position
         curLocMarker.setLatLng(newPos);

         // 2. Center the map on the user (optional)
         map.setView(newPos, 15);
       }

       function linker(url, type = 'text/plain')
       {
         var link = document.getElementById('linker');

         link.target = '_blank';
         link.href = url;
         link.click();  // simulate clicking the link

         setTimeout(function() { URL.revokeObjectURL(link.href); }, 0);
       }

       // callback(data, fileName)
       function uploadText(callback, fileTypes)
       {
         var link = document.getElementById('uploaderLink');

         link.accept = fileTypes;
         link.value = '';  // force a change in case we try to load the same file again (otherwise we don't get the onchange callback)

         link.oncancel = function()
         {
           callback(null, null);
         }

         link.onchange = function()
         {
           var file = this.files[0];

           //alert('Selected file: ' + file.name + '\nlength: ' + file.size + '\ntype: ' + file.type);

           var oFReader = new FileReader();
           oFReader.readAsText(file);
           oFReader.onload = function (oFREvent)
           {
             var data = oFREvent.target.result;
             callback(data, file.name);
           }

           oFReader.onerror = function (OFREvent)
           {
             alert("Error in reading");
           }
         };

         link.click();  // simulate clicking loader link
       }

       // callback(data, fileName, ctx)
       function loadJsonFile(callback, ctx)
       {
         uploadText(function(data, fileName)
         {
           data = parseJson(data);
           callback(data, fileName, ctx);
         }, ".json");
       }

       function parseJson(json)
       {
         var data;

         try
         {
           data = JSON.parse(json);
         } catch(e)
         {
           var errMsg = 'Error parsing JSON';
           if ( e instanceof SyntaxError )
             errMsg += ':\n\n' + e.message;
           alert(errMsg);
           data = null;
         }

         return data;
       }

       function showOnMap()
       {
         // apple maps url:
         //   saddr: source (defaults to current)
         //   daddr: destination
         //   dirflg: d=driving (default), w=walking, r=transit
         //   t (map type): m=standard, k=satellite, h=hybrid

         // google maps url:
         //   max 23 waypoints
         //   waypoints separated with '|' %7C
         //   vias are: via:< the point> --> via%3A< the point>
         //     e.g. pittsburgh|via:52.3676,4.9041|latrobe
         //var url = 'https://www.google.com/maps/dir/?api=1&origin=Paris&destination=Berlin&waypoints=via:Brussels|Amsterdam&travelmode=driving';

         var url;

         // TODO: also based on setting (expicit or os default) and/or if this is a route or marker
         // default for markers should be os default
         // defaut for routes would depend on existence of waypoints since apple maps doesn't support them

         if ( os == 'ios' )
           url = 'https://maps.apple.com/?daddr=greensburg+pa&dirflg=d';
         else
           url = 'https://www.google.com/maps/dir/?api=1&origin=Paris&destination=Berlin&waypoints=via:Brussels|Amsterdam&travelmode=driving';

         linker(url);
       }

       async function share()
       {
         // see: https://developer.mozilla.org/en-US/docs/Web/API/Navigator/share
         // can also share a url or files

         var data = {title: 'share some text', text: 'shared text'};

         try
         {
           if ( !navigator.canShare(data) )
             document.getElementById('shareRes').textContent = "can't share data";
           else
           {
             await navigator.share(data);
             document.getElementById('shareRes').textContent = "data shared successfully";
           }
         }
         catch (err)
         {
           // get an err.name==AbortError (code 20) error if user cancels
           document.getElementById('shareRes').textContent = `Error: code: ${err.code}, name: ${err.name}, msg: ${err.message}`;
         }
       }

       function getSerialPorts()
       {
         // TODO: only available in https?
         // garmin doesn't show up as a serial port

         if ( navigator.serial )
         {
           navigator.serial.getPorts().then((ports) => {
             document.getElementById('ports').textContent = ports.length ? ports : 'no serial ports available';
           });
         }
         else
         {
           document.getElementById('ports').textContent = 'serial ports not supported';
         }
       }

       function toggleGps()
       {
         if ( !running )
         {
           running = true;
           run();
           return;
         }

         if ( watchId )
         {
           navigator.geolocation.clearWatch(watchId);
           watchId = null;
           document.getElementById('startTrack').innerHTML = 'Start GPS';
           updatePosition('');
         }
         else
         {
           watchId = locationWatcher(updatePosition, document.getElementById('maxAge').value);
           document.getElementById('startTrack').innerHTML = 'Stop GPS';
           updatePosition('waiting for location...');
         }
       }

       async function lockScreen()
       {
         // see for how to monitor state and explicitly release: https://developer.mozilla.org/en-US/docs/Web/API/WakeLockSentinel

         if ( navigator.wakeLock )
         {
           try
           {
             var lock = await navigator.wakeLock.request('screen');
             document.getElementById('lock').innerHTML = 'Screen Lock acquired';
             lock.addEventListener("release", () =>
             {
               document.getElementById('lock').innerHTML = 'Screen Lock released';
             });
           }
           catch(err)
           {
             document.getElementById('lock').innerHTML = `${err.name}: ${err.message}`;
           }
         }
       }

       async function run()
       {           
         // so we know the js is running
         var count = 0;
         setInterval(function()
         {
           document.getElementById('running').textContent = 'Interval Count: ' + count++;
         }, 1000);

         if ( 'geolocation' in navigator )
           toggleGps();
         else
           updatePosition('Geolocation API is NOT available');

         lockScreen();
       }

       function updatePosition(pos)
       {
         // note:
         //   speed: meters/sec
         //   altitude: meters
         //   heading: degrees CW from north (null if speed == 0)
         //   accuracy: meters

         var str;
         if ( typeof(pos) == "string" )
         {
           str = pos;
           document.getElementById('posCount').innerHTML = '';
         }
         else
         {
           str = `timestamp: ${pos.timestamp}<br>lat: ${pos.coords.latitude}<br>lng: ${pos.coords.longitude}<br>heading: ${pos.coords.heading}<br>speed: ${pos.coords.speed}<br>altitude: ${pos.coords.altitude}<br>accuracy: ${pos.coords.accuracy}<br>altitudeAccuracy: ${pos.coords.altitudeAccuracy}`;
           document.getElementById('posCount').innerHTML = 'Position updates: ' + ++posCount;

           updateMapPos(pos);
         }

         document.getElementById('position').innerHTML = str;
       }

       function locationWatcher(updater, maxAge = 0)
       {
         const watchID = navigator.geolocation.watchPosition(
           function(position)
           {
             //console.log('location:', position);
             updater(position);
           },
           function on_error(error)
           {
             var err = 'Error (' + error.code + ') getting position: ' + error.message;
             //console.log(err);
             updater(err);
           },
           {
             //maximumAge: 5 * 1000,  // max cache time
             //timeout: 60 * 1000,
             timeout: 30 * 1000,
             maximumAge: maxAge,            // Force fresh data
             enableHighAccuracy: true,
           }
         );
         
         return watchID;
       }

    </script>

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
       #map { height: 400px; width: 100%; } /* Map must have a height */
    </style>

    <style>
       * {
           font-family: sans-serif;
           font-size: 20px;
           box-sizing: border-box;
           padding: 0;
           margin: 10px;
       }
    </style>

  </head>

  <body>
    <a href="" id="linker" style="display:none"></a>
    <input type="file" id="uploaderLink" style="display:none">
    <div id="title">Position Test</div>
    <div id="map"></div>
    <label>Max Position Age:<input id="maxAge" value="0"></label><br>
    <button id="startTrack">Start GPS</button>
    <div id="running"></div>
    <div id="lock"></div>
    <div id="posCount"></div>
    <div id="position"></div>
    <button id="showOnMap">Show on Map</button>
    <button id="share">Share</button>
    <button id="loadFile">Load File</button>
    <div id="loadFileRes"></div>
    <div id="shareRes"></div>
    <div id="ports"></div>
  </body>
</html>

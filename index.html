<!DOCTYPE html>
<!-- @@COPYRIGHT -->
<html>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- you can also inject a whole other script (everything is global)
    <script>
       function otherLocationService(updater)
       {
         var data = {timestamp: 1, coords: {latitude: 2, longitude: 3, heading: 4, speed: 5}};
         updater(data);
       }
    </script>
    -->

    <script>

       // wait for everything to load
       window.addEventListener('load', startup, true);

       var posCount = 0;
       var running = false;
       var watchId;

       function startup()
       {
         document.getElementById('startTrack').addEventListener('click', toggleGps);

         document.getElementById('map').addEventListener('click', showOnMap);

         // TODO: only available in https
         // otherwise navigator.share is not a function
         if ( 'share' in navigator )
           document.getElementById('share').addEventListener('click', share);
         else
           document.getElementById('share').style.visibility = 'hidden';
       }

       function linker(url, type = 'text/plain')
       {
         var link = document.getElementById('linker');

         link.target = '_blank';
         link.href = url;
         link.click();  // simulate clicking the link

         setTimeout(function() { URL.revokeObjectURL(link.href); }, 0);
       }

       function showOnMap()
       {
         // apple maps url:
         //   saddr: source (defaults to current)
         //   daddr: destination
         //   dirflg: d=driving (default), w=walking, r=transit
         //   t (map type): m=standard, k=satellite, h=hybrid

         var url = 'https://maps.apple.com/?daddr=greensburg+pa&dirflg=d';

         // google maps url:
         //   max 23 waypoints
         //   waypoints separated with '|' %7C
         //   vias are: via:< the point> --> via%3A< the point>
         //     e.g. pittsburgh|via:52.3676,4.9041|latrobe
         //var url = 'https://www.google.com/maps/dir/?api=1&origin=Paris&destination=Berlin&waypoints=via:Brussels|Amsterdam&travelmode=driving';

         linker(url);
       }

       async function share()
       {
         // see: https://developer.mozilla.org/en-US/docs/Web/API/Navigator/share
         // can also share a url or files

         var data = {title: 'share some text', text: 'shared text'};

         try
         {
           if ( !navigator.canShare(data) )
             document.getElementById('shareRes').textContent = "can't share data";
           else
           {
             await navigator.share(data);
             document.getElementById('shareRes').textContent = "data shared successfully";
           }
         }
         catch (err)
         {
           // get an err.name==AbortError (code 20) error if user cancels
           document.getElementById('shareRes').textContent = `Error: code: ${err.code}, name: ${err.name}, msg: ${err.message}`;
         }
       }

       function toggleGps()
       {
         if ( !running )
         {
           running = true;
           run();
           return;
         }

         if ( watchId )
         {
           navigator.geolocation.clearWatch(watchId);
           watchId = null;
           document.getElementById('startTrack').innerHTML = 'Start GPS';
           updatePosition('');
         }
         else
         {
           watchId = locationWatcher(updatePosition);
           document.getElementById('startTrack').innerHTML = 'Stop GPS';
           updatePosition('waiting for location...');
         }
       }

       async function run()
       {           

         // TODO: add some other check for a location service that calls updatePosition()
         // or inject another script as above
/*
         if ( typeof(otherLocationService) != 'undefined' )
           otherLocationService(updatePosition);
         else if ( navigator.geolocation )
           locationWatcher(updatePosition);
*/
         // so we know the js is running
         var count = 0;
         setInterval(function()
         {
           document.getElementById('running').innerHTML = 'Interval Count: ' + count++;
         }, 1000);

         if ( 'geolocation' in navigator )
           toggleGps();
         else
           updatePosition('Geolocation API is NOT available');

         if ( navigator.wakeLock )
         {
           try
           {
             var lock = await navigator.wakeLock.request('screen');
             document.getElementById('lock').innerHTML = 'Screen Lock acquired';
             lock.addEventListener("release", () =>
             {
               document.getElementById('lock').innerHTML = 'Screen Lock released';
             });
           }
           catch(err)
           {
             document.getElementById('lock').innerHTML = `${err.name}: ${err.message}`;
           }
         }

       }

       function updatePosition(pos)
       {
         // note:
         //   speed: meters/sec
         //   altitude: meters
         //   heading: degrees CW from north (null if speed == 0)
         //   accuracy: meters

         var str;
         if ( typeof(pos) == "string" )
         {
           str = pos;
           document.getElementById('posCount').innerHTML = '';
         }
         else
         {
           str = `timestamp: ${pos.timestamp}<br>lat: ${pos.coords.latitude}<br>lng: ${pos.coords.longitude}<br>heading: ${pos.coords.heading}<br>speed: ${pos.coords.speed}<br>altitude: ${pos.coords.altitude}<br>accuracy: ${pos.coords.accuracy}<br>altitudeAccuracy: ${pos.coords.altitudeAccuracy}`;
           document.getElementById('posCount').innerHTML = 'Position updates: ' + ++posCount;
         }

         document.getElementById('position').innerHTML = str;
       }

       function locationWatcher(updater)
       {
         const watchID = navigator.geolocation.watchPosition(
           function(position)
           {
             //console.log('location:', position);
             updater(position);
           },
           function on_error(error)
           {
             var err = 'Error (' + error.code + ') getting position: ' + error.message;
             //console.log(err);
             updater(err);
           },
           {
             //maximumAge: 5 * 1000,  // max cache time
             //timeout: 60 * 1000,
             timeout: 30 * 1000,
             maximumAge: 0,            // Force fresh data
             enableHighAccuracy: true,
           }
         );
         
         return watchID;
       }

    </script>

    <style>
       * {
           font-family: sans-serif;
           font-size: 20px;
           box-sizing: border-box;
           padding: 0;
           margin: 10px;
       }
    </style>

  </head>

  <body>
    <a href="" id="linker" style="display:none"></a>
    <div id="title">Position Test</div>
    <button id="startTrack">Start GPS</button>
    <div id="running"></div>
    <div id="lock"></div>
    <div id="posCount"></div>
    <div id="position"></div>
    <button id="map">Show on Map</button>
    <button id="share">Share</button>
    <div id="shareRes"></div>
  </body>
</html>

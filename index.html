    <script>

       class Compass
       {
         #enabled;
         #callback;

         #handler = (evt) =>  // arrow function binds 'this'
         {
           if ( !this.#callback )
             return;
             
           // note:
           //   event.beta: X axis tilt (front to back, flat or upright)
           //   event.gamma: Y axis roll (landscape/portrait)
           //   event.alpha: Z axis rotate (compass direction 0-360)
           //   event.absolute: true if the device is providing absolute orientation (relative to the Earth's magnetic field)

           // note: webkitCompassHeading is more accurate than alpha on iOS
           const heading = evt.webkitCompassHeading || (360 - evt.alpha);

           this.#callback({x: evt.beta, y: evt.gamma, z: heading, absolute: evt.absolute}); 
         }

         constructor()
         {
         }
         
         // callback({x, y, z, absolute})
         setCallback(callback)
         {
           this.#callback = callback;
         }

         toggleEnable()
         {
           return this.enable(!this.#enabled);
         }

         isEnabled()
         {
           return this.#enabled;
         }

         async enable(_enable)
         {
           if ( _enable == this.#enabled )
             return true;

           if ( this.#enabled )
           {
             window.removeEventListener('deviceorientation', this.#handler, true);  // remove must have the same options
           }
           else
           {
             // iOS 13+ Permission Request
             if (typeof DeviceOrientationEvent.requestPermission === 'function')
             {
               const response = await DeviceOrientationEvent.requestPermission();
               if (response !== 'granted')
               {
                 console.log('Compass: Permission denied');
                 return false;
               }
             }

             window.addEventListener('deviceorientation', this.#handler, true);
           }

           this.#enabled = _enable;

           return true;
         }
       }


       class Gps
       {
         #enabled;
         #id;
         #maxAge;
         #callback;

         constructor(maxAge)
         {
           this.#maxAge = maxAge;
         }

         // callback(position)
         setCallback(callback)
         {
           this.#callback = callback;
         }

         setMaxAge(maxAge)
         {
           this.#maxAge = maxAge;
         }

         toggleEnable()
         {
           return this.enable(!this.#enabled);
         }

         isEnabled()
         {
           return this.#enabled;
         }

         enable(_enable)
         {
           if ( _enable == this.#enabled )
             return true;

           if ( this.#enabled )
           {
             navigator.geolocation.clearWatch(this.#id);
             this.#id = null;
           }
           else
           {
             if ( !('geolocation' in navigator) )
               return false;

             var options =
             {
               timeout: 30 * 1000,
               maximumAge: this.#maxAge,
               enableHighAccuracy: true,
             };

             this.#id = navigator.geolocation.watchPosition(
               this.#callback,
               function(error) { console.log('GPS:', err); },
               options
             );
           }

           this.#enabled = _enable;

           return true;
         }
       }

       // wait for everything to load
       window.addEventListener('load', startup, true);

       var posCount = 0;
       var running = false;
       var watchId;
       var map;
       var curLocMarker;
       var os;
       var prevHeading = 0;
       var compass = new Compass();
       var gps = new Gps();

       
       async function startup()
       {
         document.getElementById('startTrack').addEventListener('click', toggleRun);

         document.getElementById('showOnMap').addEventListener('click', showOnMap);

         // TODO: only available in https
         // otherwise navigator.share is not a function
         if ( 'share' in navigator )
           document.getElementById('share').addEventListener('click', function() { share('share some text', 'shared text'); });
         else
           document.getElementById('share').style.visibility = 'hidden';

         document.getElementById('loadFile').addEventListener('click', function()
         {
           loadJsonFile(function(data, fileName)
           {
             document.getElementById('loadFileRes').textContent = fileName;
           });
         });
  
         os = await getMobileOS();
         document.getElementById('os').textContent = 'OS: ' + os;

         initMap();

         // needs user action in ios
         //lockScreen();

         // so we know the js is running
         //var count = 0;
         //setInterval(function()
         //{
         //  document.getElementById('running').textContent = 'Idle Count: ' + count++;
         //}, 1000);
       }

       function initMap()
       {
         // Initialize the map centered on a default location
         map = L.map('map').setView([0, 0], 2); 

         // Add OpenStreetMap tiles
         //L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
         L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',
         {
           maxZoom: 19,
           attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
         }).addTo(map);

         // Create a special marker for the user (The "Blue Dot")
         curLocMarker = L.circleMarker([0, 0], {
           radius: 8,
           fillColor: "#3388ff",
           color: "#fff",
           weight: 2,
           opacity: 1,
           fillOpacity: 0.8
         }).addTo(map);
       }

       async function toggleRun()
       {           
         if ( !running )
         {
           running = true;

           compass.setCallback(function(val)
           {
             var heading = val.z.toFixed(0);

             if ( heading == prevHeading )
               return;

             prevHeading = heading;

             document.getElementById('compass').textContent = 'Compass: ' + heading;
             document.getElementById('map').style.transform = `rotate(${-heading}deg)`;
           });

           gps.setCallback(function(val)
           {
             updatePosition(val);
           });

           lockScreen();
         }

         if ( !compass.toggleEnable() )
           document.getElementById('compass').textContent = 'Error starting compass';

         gps.setMaxAge(parseInt(document.getElementById('maxAge').value));

         if ( !gps.toggleEnable() )
           updatePosition('Error starting gps');

         updatePosition(gps.isEnabled() ? 'waiting for GPS...' : '');
         document.getElementById('startTrack').textContent = gps.isEnabled() ? 'Stop GPS' : 'Start GPS';

         document.getElementById('compass').textContent = (compass.isEnabled() ? 'waiting for compass...' : '');
       }

       function updateMapPos(pos)
       {
         const { latitude, longitude, accuracy } = pos.coords;

         const newPos = [latitude, longitude];

         // 1. Move the marker to the new position
         curLocMarker.setLatLng(newPos);

         // 2. Center the map on the user (optional)
         map.setView(newPos, 15);
       }

       function updatePosition(pos)
       {
         // note:
         //   speed: meters/sec
         //   altitude: meters
         //   heading: degrees CW from north (null if speed == 0)
         //   accuracy: meters

         function fixedStr(val, places)
         {
           return val ? val.toFixed(places) : 0;
         }

         var str;

         if ( typeof(pos) == "string" )
           str = pos;
         else
         {
           str = `Position: ${++posCount}<br>`;
           str += `timestamp: ${pos.timestamp}<br>`;
           str += `speed: ${mpsToUiUnitStr(pos.coords.speed, 2)}<br>`;
           str += `heading: ${fixedStr(pos.coords.heading, 2)}<br>`;
           str += `lat: ${fixedStr(pos.coords.latitude, 5)}<br>lng: ${fixedStr(pos.coords.longitude, 5)}<br>`;
           str += `altitude: ${metersToUiUnitStr(pos.coords.altitude, 2, true)}<br>`;
           str += `accuracy: ${metersToUiUnitStr(pos.coords.accuracy, 2, true)}<br>`;
           str += `altitudeAccuracy: ${metersToUiUnitStr(pos.coords.altitudeAccuracy, 2, true)}`;

           updateMapPos(pos);
         }

         document.getElementById('position').innerHTML = str;
       }

       function showOnMap()
       {
         // apple maps url:
         //   saddr: source (defaults to current)
         //   daddr: destination
         //   dirflg: d=driving (default), w=walking, r=transit
         //   t (map type): m=standard, k=satellite, h=hybrid

         // google maps url:
         //   max 23 waypoints
         //   waypoints separated with '|' %7C
         //   vias are: via:< the point> --> via%3A< the point>
         //     e.g. pittsburgh|via:52.3676,4.9041|latrobe
         //var url = 'https://www.google.com/maps/dir/?api=1&origin=Paris&destination=Berlin&waypoints=via:Brussels|Amsterdam&travelmode=driving';

         var url;

         // TODO: also based on setting (expicit or os default) and/or if this is a route or marker
         // default for markers should be os default
         // defaut for routes would depend on existence of waypoints since apple maps doesn't support them

         if ( os == 'ios' )
           url = 'https://maps.apple.com/?daddr=greensburg+pa&dirflg=d';
         else
           url = 'https://www.google.com/maps/dir/?api=1&origin=latrobe,pa&destination=pittsburgh,pa&waypoints=via:greensburg,pa|irwin,pa&travelmode=driving';

         linker(url);
       }

       async function share(title, text)
       {
         // see: https://developer.mozilla.org/en-US/docs/Web/API/Navigator/share
         // can also share a url or files

         var data = {title: title, text: text};

         try
         {
           if ( !navigator.canShare(data) )
             document.getElementById('shareRes').textContent = "can't share data";
           else
           {
             await navigator.share(data);
             document.getElementById('shareRes').textContent = "data shared successfully";
           }
         }
         catch (err)
         {
           // get an err.name==AbortError (code 20) error if user cancels
           document.getElementById('shareRes').textContent = `Error: code: ${err.code}, name: ${err.name}, msg: ${err.message}`;
         }
       }

       // TODO: toggle
       async function startAccel()
       {
         function handleMotion(event)
         {
           var a = event.acceleration;
           var ag = event.accelerationIncludingGravity;
           var rr = event.rotationRate;
           document.getElementById('accel').innerHTML = `Accelerometer:<br>interval: ${event.interval}<br>aX: ${a.x}, aY: ${a.y}, aZ: ${a.z}<br>agX: ${ag.x}, agY: ${ag.y}, agZ: ${ag.z}<br>rrX: ${rr.beta}, rrY: ${rr.gamma}, rrZ: ${rr.alpha}`;
         }


         // might work in chrome, but not in safari
         /*
         if ('Accelerometer' in window)
         {
           let sensor = new Accelerometer({frequency: 60});

           sensor.addEventListener('reading', () => {
             document.getElementById('accel').textXContent = `X: ${sensor.x}, Y: ${sensor.y}, Z: ${sensor.z}`;
           });

           sensor.start();
         }
         else
         {
           document.getElementById('accel').textXContent = 'Accelerometer not supported';
         }
         */

         if ( typeof DeviceMotionEvent.requestPermission === 'function' )
         {
           try
           {
             const permissionState = await DeviceMotionEvent.requestPermission();

             document.getElementById('accel').textContent = 'Accelerometer: ' +  permissionState;

             if (permissionState === 'granted')
               window.addEventListener('devicemotion', handleMotion);
           }
           catch (error)
           {
             document.getElementById('accel').textContent = 'Accelerometer not supported';
           }
         }
         else
         {
           document.getElementById('accel').textContent = 'Accelerometer: started';

           // Non-iOS browsers usually don't require the explicit request
           window.addEventListener('devicemotion', handleMotion);
         }
       }

       // TODO: handle foreground detection (if we lose it on backgrounding) and/or disable
       // probably have a separate ui button to toggle this
       async function lockScreen()
       {
         // see for how to monitor state and explicitly release: https://developer.mozilla.org/en-US/docs/Web/API/WakeLockSentinel

         if ( navigator.wakeLock )
         {
           try
           {
             var lock = await navigator.wakeLock.request('screen');
             document.getElementById('lock').innerHTML = 'Screen Lock acquired';
             lock.addEventListener("release", () =>
             {
               document.getElementById('lock').innerHTML = 'Screen Lock released';
             });
           }
           catch(err)
           {
             document.getElementById('lock').innerHTML = `${err.name}: ${err.message}`;
           }
         }
       }

       async function getMobileOS()
       {
         // 1. Try the Modern API (Chrome/Android/Edge)
         if ( navigator.userAgentData )
         {
           try
           {
             const hints = await navigator.userAgentData.getHighEntropyValues(['platform']);

             if (hints.platform === 'Android')
               return 'android';
             //if (hints.platform === "iOS")
             //  return "iOS"; // Rare, but possible in future
           }
           catch (e)
           {
             // Fall through to legacy if API fails
           }
         }

         // 2. Fallback to Legacy String (Safari/iOS/Firefox)
         //const ua = navigator.userAgent;
         const ua = navigator.userAgent || navigator.vendor || window.opera

         // Windows Phone must come first because its UA also contains "Android"
         if (/windows phone/i.test(ua))
           return 'winphone';

         if (/android/i.test(ua))
           return 'android';

         // Detailed iOS check (Includes iPadOS "Macintosh" fix)
         if ( (/iPad|iPhone|iPod/.test(ua) && !window.MSStream) || 
              (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1))
           return 'ios';

         return 'other';
       }

       function linker(url, type = 'text/plain')
       {
         var link = document.getElementById('linker');

         link.target = '_blank';
         link.href = url;
         link.click();  // simulate clicking the link

         setTimeout(function() { URL.revokeObjectURL(link.href); }, 0);
       }

       // callback(data, fileName)
       function uploadText(callback, fileTypes)
       {
         var link = document.getElementById('uploaderLink');

         link.accept = fileTypes;
         link.value = '';  // force a change in case we try to load the same file again (otherwise we don't get the onchange callback)

         link.oncancel = function()
         {
           callback(null, null);
         }

         link.onchange = function()
         {
           var file = this.files[0];

           //alert('Selected file: ' + file.name + '\nlength: ' + file.size + '\ntype: ' + file.type);

           var oFReader = new FileReader();
           oFReader.readAsText(file);
           oFReader.onload = function (oFREvent)
           {
             var data = oFREvent.target.result;
             callback(data, file.name);
           }

           oFReader.onerror = function (OFREvent)
           {
             alert("Error in reading");
           }
         };

         link.click();  // simulate clicking loader link
       }

       // callback(data, fileName, ctx)
       function loadJsonFile(callback, ctx)
       {
         uploadText(function(data, fileName)
         {
           data = parseJson(data);
           callback(data, fileName, ctx);
         }, ".json");
       }

       function parseJson(json)
       {
         var data;

         try
         {
           data = JSON.parse(json);
         } catch(e)
         {
           var errMsg = 'Error parsing JSON';
           if ( e instanceof SyntaxError )
             errMsg += ':\n\n' + e.message;
           alert(errMsg);
           data = null;
         }

         return data;
       }

       const M_TO_MI = 0.000621371;  // convert meters to miles
       const M_TO_FT = 3.28084;  // convert meters to feet
       const M_TO_K = 0.001;  // convert meters to kilometers
       const gPrefs = {units: 'm'};

       function metersToMiles(value)
       {
         return value * M_TO_MI;
       }

       function mpsToMph(mps)
       {
         return Math.round(metersToMiles(mps) * 3600);
       }

       function metersToUiUnitStr(meters, places, small)
       {
         if ( !meters )
           meters = 0;
         if ( places == null )
           places = 1;

         if ( gPrefs.units == 'm' )
         {
           if ( !small && (meters * M_TO_MI < 0.25 ) )
             small = true;
           return small ? ''.concat((meters * M_TO_FT).toFixed(places), 'ft') : ''.concat((meters * M_TO_MI).toFixed(places), 'mi');
         }

         if ( !small && (meters * M_TO_K < 0.25) )
           small = true;
         return small ? ''.concat(meters.toFixed(places), 'm') : ''.concat((meters * M_TO_K).toFixed(places), 'K');
       }

       function mpsToUiUnitStr(metersPerSec, places, small)
       {
         if ( !metersPerSec )
           metersPerSec = 0;
         if ( places == null )
           places = 1;

         if ( gPrefs.units == 'm' )
         {
           if ( !small && mpsToMph(metersPerSec) < 5 )
             small = true;
           return small ? ''.concat((metersPerSec * M_TO_FT).toFixed(places), 'ft/s') : ''.concat(((metersPerSec * M_TO_MI) * 3600).toFixed(places), 'mph');
         }

         if ( !small && mpsToMph(metersPerSec) < 5 )
           small = true;
         return small ? ''.concat(metersPerSec.toFixed(places), 'mps') : ''.concat(((metersPerSec * M_TO_K) * 3600).toFixed(places), 'kph');
       }

    </script>
